<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div id="box" class="box"></div>
        <div class="controls">
            <div class="control">
                <div class="widthControl controlBox">
                    <label for="#">Width</label>
                    <div class="controlValues">
                        <input type="number" name="minValue" id="minWidthValue" placeholder="00">
                        <input type="number" name="maxValue" id="maxWidthValue" placeholder="100">
                    </div>
                    <input id="widthControlRange" type="range" min="0" max="100">
                </div>
            </div>
            <div class="saveButtonContainer">
                <button>Re-set</button><button>Save</button>
            </div>
        </div>
    </div>
</body>
</html>

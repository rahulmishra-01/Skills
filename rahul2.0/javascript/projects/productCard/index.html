<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="productCardContainer">
        <div class="productCard">
            <div class="productImage">
                <img src="./images/product1.jpg" alt="product1">
            </div>
            <div class="productDetails">
                <h2 class="productName">Product 1</h2>
                <p class="productPrice">Rs. 1000</p>
            </div>
                <p class="productDescription">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quae, repellendus.</p>
            <div class="productButtons">
                <button class="addToCartButton">Add to Cart</button>
                <button class="buyNowButton">Buy Now</button>
            </div>
        </div>
    </div>
</body>
</html>
